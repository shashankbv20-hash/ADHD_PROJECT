<line x1="1030" y1="969" x2="992" y2="969" stroke="#44546A" stroke-width="3" marker-end="url(#head)"/>
<line x1="710" y1="969" x2="672" y2="969" stroke="#44546A" stroke-width="3" marker-end="url(#head)"/>
<line x1="390" y1="969" x2="352" y2="969" stroke="#44546A" stroke-width="3" marker-end="url(#head)"/>
<path d="M 70 469 L 44 469 L 44 969 L 67 969" fill="none" stroke="#7A869A" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#headg)"/>
<text x="70" y="602" font-size="15" font-style="italic" fill="#5A6B7D">Planned hand-off to the website after the model is validated</text>
<rect x="330" y="1118" width="34" height="24" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/>
<text x="376" y="1137" font-size="17" fill="#34414F">Done</text>
<rect x="452.8" y="1118" width="34" height="24" rx="6" fill="#FFF4E0" stroke="#E08A00" stroke-width="2.5"/>
<text x="498.8" y="1137" font-size="17" fill="#34414F">Done, needs confirmation or weak</text>
<rect x="833.2" y="1118" width="34" height="24" rx="6" fill="#FDECEC" stroke="#C62828" stroke-width="2.5"/>
<text x="879.2" y="1137" font-size="17" fill="#34414F">Done, result not usable yet</text>
<rect x="1167.6" y="1118" width="34" height="24" rx="6" fill="#F2F4F7" stroke="#7A869A" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="1213.6" y="1137" font-size="17" fill="#34414F">Planned or deferred</text>
<text x="1000" y="1180" font-size="15" fill="#5A6B7D" text-anchor="middle">Research prototype. Not a clinical diagnostic tool. The EEG model is not connected to the website yet.</text>
</svg>