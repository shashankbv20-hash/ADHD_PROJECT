# Edge rate limiting with nginx, for self-hosted deployments (one limiter in front of all API
# instances). NOT RUN OR VERIFIED by the project: test with `nginx -t` and load-test in staging.
#
# Place the two limit_req_zone lines in the http {} block and the server block alongside your TLS
# configuration. The API must then run with TRUST_PROXY_HEADERS=true and
# FORWARDED_ALLOW_IPS=<this proxy's address>, and must be reachable ONLY through this proxy.

limit_req_zone $binary_remote_addr zone=attune_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=attune_heavy:10m rate=1r/s;
limit_req_status 429;

upstream attune_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name api.example.org;
    # ssl_certificate / ssl_certificate_key ...

    client_max_body_size 256k;           # matches MAX_REQUEST_BYTES

    location / {
        limit_req zone=attune_api burst=30 nodelay;
        proxy_pass http://attune_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append client-supplied values
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Expensive writes: trial event batches and data erasure.
    location ~ ^/api/v1/(sessions/.+/activities/.+/events:batch|subjects/.+/data-erasure)$ {
        limit_req zone=attune_heavy burst=5 nodelay;
        proxy_pass http://attune_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health checks must not be limited.
    location /health/ {
        proxy_pass http://attune_api;
        access_log off;
    }

    # The metrics endpoint is token-protected by the API, but keep it off the public internet.
    location = /metrics { return 404; }
}
