name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Dependency audit (production dependencies, high severity and above)
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - name: Build (default demo provider; no secrets needed)
        run: npm run build
      - name: Container image builds (not pushed)
        run: docker build -t attune-web:ci .

  backend:
    name: Backend (ruff, pytest incl. Firestore emulator)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: python -m compileall -q app tests
      - name: Container image builds (not pushed)
        run: docker build -t attune-api:ci .
      # Firestore emulator needs a JDK >= 21 and Node (firebase-tools).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Firestore emulator jar
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-firestore-v1.22.0
      - name: pytest against in-memory repository and the Firestore emulator
        # "demo-" project IDs can never reach a real Firebase project.
        run: >
          npx --yes firebase-tools@15.34.2 emulators:exec
          --config ../frontend/firebase.json
          --only auth,firestore
          --project demo-attune-tests
          "python -m pytest -q"

  contract:
    name: Contract (TypeScript client vs real FastAPI app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Start the fake-auth, in-memory backend (loopback only, test use)
        working-directory: backend
        env:
          ATTUNE_ALLOW_FAKE_AUTH: "1"
        run: |
          python scripts/serve_test_app.py --port 8765 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/health/live && exit 0
            sleep 1
          done
          echo "backend did not start" && exit 1
      - name: Run contract tests
        working-directory: frontend
        env:
          BACKEND_CONTRACT_URL: http://127.0.0.1:8765
        run: npx vitest run src/lib/backend/contract.test.ts

  rules:
    name: Firestore security rules (emulator)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Cache Firestore emulator jar
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-firestore-v1.22.0
      - run: npm run test:rules

  e2e-live:
    name: Live signed-in e2e (Auth + Firestore emulators, real API)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -r ../backend/requirements-dev.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Cache Firestore emulator jar
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-firestore-v1.22.0
      - run: npm run test:e2e:live
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-live
          path: frontend/playwright-report-live
          retention-days: 7

  e2e:
    name: Frontend e2e (Playwright smoke tests)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
